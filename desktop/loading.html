<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Forge</title>
  <style>
    :root { color-scheme: dark light; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0f1216; color: #e6edf3;
    }
    .box { text-align: center; padding: 2rem; }
    .brand { font-weight: 600; letter-spacing: -0.02em; font-size: 1.4rem; }
    .msg { margin-top: 0.75rem; color: #8b9bb0; font-size: 0.95rem; }
    .spin {
      width: 28px; height: 28px; margin: 1.25rem auto 0;
      border: 2px solid #2a3340; border-top-color: #3d9cf0;
      border-radius: 50%; animation: r 0.8s linear infinite;
    }
    @keyframes r { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="brand">Forge</div>
    <div class="msg" id="msg">Starting local runtime…</div>
    <div class="spin" aria-hidden="true"></div>
  </div>
</body>
</html>
